name: Build Zrythm v1 Windows Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zrythm
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout v1.0.0 tag (fork)
        shell: bash
        run: |
          cd zrythm
          git remote add upstream https://github.com/zrythm/zrythm.git
          git fetch upstream tag v1.0.0
          git checkout v1.0.0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            unzip
            base-devel
            tree
            guile
            libguile-devel
            mingw-w64-i686-toolchain
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-chromaprint
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-cantarell-fonts
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-python3
            mingw-w64-ucrt-x86_64-gtk-doc
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-xxhash
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-iconv
            mingw-w64-ucrt-x86_64-graphene
            mingw-w64-ucrt-x86_64-libsass
            mingw-w64-ucrt-x86_64-sassc
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gdk-pixbuf2

      - name: Patch mingw-w64-headers stralign.h bug (ua_wcschr ambiguous declaration)
        run: |
          find /ucrt64 /mingw32 /mingw64 -name "stralign.h" 2>/dev/null | while read -r f; do
            echo "Patching: $f"
            sed -i -E 's/#if defined\(__cplusplus\) && defined\(_WConst_[Rr]eturn\)/#if 0/' "$f"
          done
          true

      - name: Move repo into MSYS2-native path
        run: |
          mkdir /c/src
          MSYS=winsymlinks:native mv /d/a/*/zrythm/zrythm /c/src/zrythm 2>/dev/null || \
          MSYS=winsymlinks:native mv "$GITHUB_WORKSPACE/zrythm" /c/src/zrythm
          cd /c/src
          git clone https://gitlab.zrythm.org/zrythm/zrythm-builds
          git clone https://gitlab.zrythm.org/zrythm/zrythm-installer

      - name: Disable PKGBUILD check() phase (avoids flaky mingw test failures)
        run: |
          sed -i "s/^BUILDENV=.*/BUILDENV=(!distcc color !ccache !check !sign)/" /etc/makepkg.conf
          sed -i "s/^BUILDENV=.*/BUILDENV=(!distcc color !ccache !check !sign)/" /etc/makepkg_mingw.conf
          grep BUILDENV /etc/makepkg.conf /etc/makepkg_mingw.conf

      - name: Build prebuilt deps (lilv, libpanel for mingw)
        run: |
          cd /c/src/zrythm-installer
          meson build -Ddistro=windows-msys
          ninja -C build run-mingw-lilv run-mingw-libpanel

      - name: Fetch Carla source (meson wrap, not in git tree)
        run: |
          cd /c/src/zrythm
          meson subprojects download carla || true

      - name: Build & install Carla natively (real UCRT64 DLLs, matching toolchain)
        run: |
          cd /c/src/zrythm/subprojects/carla
          make msys2fix
          make -j"$(nproc)"
          make install PREFIX=/ucrt64
          echo "--- installed carla files ---"
          find /ucrt64 -iname "*carla*" 2>/dev/null

      - name: Patch meson.build dbghelp linking bug (upstream oversight)
        run: |
          cd /c/src/zrythm
          sed -i "s/    cc.find_library ('dbghelp')/    dbg_help_lib = cc.find_library ('dbghelp')/" meson.build
          grep -n "dbg_help_lib = cc.find_library ('dbghelp')" meson.build

      - name: Fix hardcoded install prefix (portable build resolves paths from exe location)
        run: |
          cd /c/src/zrythm
          echo "" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -n "g_win32_get_package_installation_directory_of_module" src/zrythm.c

      - name: Remove 32-bit Carla VST bridge requirement (not building 32-bit Carla)
        run: |
          cd /c/src/zrythm
          LINE=$(grep -n "carla_bins_dir_32bit = get_option" meson.build | cut -d: -f1)
          echo "Anchor line: $LINE"
          sed -i "$((LINE+1)),$((LINE+10))d" meson.build
          echo "--- result ---"
          sed -n "$((LINE-2)),$((LINE+3))p" meson.build

      - name: Replace non-ASCII chars in TRANSLATORS
        run: |
          cd /c/src/zrythm
          iconv -c -f utf-8 -t ascii//TRANSLIT TRANSLATORS > TRANSLATORS2 || true
          rm -f TRANSLATORS
          mv TRANSLATORS2 TRANSLATORS
          sed -i -e "s|\"|'|g" TRANSLATORS

      - name: Configure
        run: |
          cd /c/src/zrythm
          sed -i -e "s|'-lssp'|'-Wl,-allow-multiple-definition'|g" meson.build
          meson build --prefix=/ucrt64 -Db_lto=false -Dmanpage=false -Dtests=false -Dwrap_mode=default

      - name: Compile
        run: ninja -C /c/src/zrythm/build

      - name: Install into clean destdir (no build objects, real .exe)
        run: |
          cd /c/src/zrythm
          DESTDIR=/c/src/package ninja -C build install
          find /c/src/package -name "*.o" -o -name "*.a" | xargs -r rm -f

      - name: Flatten package structure (remove nested prefix folder, simple bin/lib/share layout)
        run: |
          cd /c/src/package
          find . -maxdepth 6
          # locate zrythm.exe wherever meson actually nested it (the real
          # prefix path can resolve as either "/ucrt64/..." or the fully
          # expanded "a/_temp/msys64/ucrt64/..." depending on how meson
          # handles the MSYS mount alias vs its real underlying path) and
          # flatten from its parent (the "bin" folder's parent) upward.
          EXE_PATH=$(find . -iname "zrythm.exe" | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "zrythm.exe not found anywhere in package!"
            exit 1
          fi
          PREFIX_DIR=$(dirname "$(dirname "$EXE_PATH")")
          echo "Found zrythm.exe at: $EXE_PATH"
          echo "Resolved prefix dir: $PREFIX_DIR"
          if [ "$PREFIX_DIR" != "." ]; then
            mv "$PREFIX_DIR"/* .
            # clean up now-empty parent chain
            rmdir -p "$PREFIX_DIR" 2>/dev/null || true
          fi
          echo "--- flattened top level ---"
          ls /c/src/package

      - name: Compile GSettings schema (DESTDIR install skips this, causes silent exit)
        run: |
          SCHEMA_DIR=$(dirname "$(find /c/src/package -iname "org.zrythm.Zrythm.gschema.xml" | head -1)")
          if [ -z "$SCHEMA_DIR" ]; then
            echo "gschema.xml not found anywhere in package! searching wider:"
            find /c/src/package -iname "*.gschema.xml"
            exit 1
          fi
          echo "Found schema dir: $SCHEMA_DIR"
          ls "$SCHEMA_DIR"
          glib-compile-schemas "$SCHEMA_DIR"
          ls "$SCHEMA_DIR"

      - name: Bundle gdk-pixbuf SVG loader (fixes "SVG loader was not found" crash)
        run: |
          BINDIR="/c/src/package/bin"
          LOADER_SRC_DIR="/ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          LOADER_DST_DIR="$BINDIR/../lib/gdk-pixbuf-2.0/2.10.0/loaders"
          mkdir -p "$LOADER_DST_DIR"
          cp -v "$LOADER_SRC_DIR"/*.dll "$LOADER_DST_DIR/"
          ls "$LOADER_DST_DIR"
          # generate the cache, then strip directory prefixes so entries are bare
          # filenames -- gdk-pixbuf resolves non-absolute paths in this file
          # relative to the cache file's own directory, which is what makes this
          # portable regardless of where the package gets extracted.
          GDK_PIXBUF_MODULEDIR="$LOADER_DST_DIR" gdk-pixbuf-query-loaders > "$LOADER_DST_DIR/loaders.cache"
          sed -i -E 's|^"[^"]*[\\/]([^\\/"]+\.dll)"|"\1"|' "$LOADER_DST_DIR/loaders.cache"
          echo "--- final loaders.cache ---"
          cat "$LOADER_DST_DIR/loaders.cache"

      - name: Bundle GLib/GIO helper executables (gdbus, gspawn helpers - used via subprocess, not linking)
        run: |
          BINDIR="/c/src/package/bin"
          for exe in gdbus.exe gio.exe gio-launch-desktop.exe gsettings.exe gspawn-win64-helper.exe gspawn-win64-helper-console.exe; do
            [ -f "/ucrt64/bin/$exe" ] && cp -v "/ucrt64/bin/$exe" "$BINDIR/"
          done

      - name: Create portable launcher (sets schema/data dirs relative to exe)
        run: |
          BINDIR="/c/src/package/bin"
          SCHEMA_DIR=$(dirname "$(find /c/src/package -iname "org.zrythm.Zrythm.gschema.xml" | head -1)")
          SHARE_DIR=$(dirname "$(dirname "$SCHEMA_DIR")")
          # convert /c/src/package/ucrt64/... msys path to a Windows-relative path from BINDIR
          REL_SHARE=$(python3 -c "import os; print(os.path.relpath('$SHARE_DIR','$BINDIR').replace('/', '\\\\'))")
          echo "Relative share dir from bin: $REL_SHARE"
          cat << BATEOF > "$BINDIR/zrythm-launcher.bat"
          @echo off
          set "HERE=%~dp0"
          set "GSETTINGS_SCHEMA_DIR=%HERE%${REL_SHARE}\glib-2.0\schemas"
          set "XDG_DATA_DIRS=%HERE%${REL_SHARE}"
          set "GDK_PIXBUF_MODULE_FILE=%HERE%..\lib\gdk-pixbuf-2.0\2.10.0\loaders\loaders.cache"
          set "GSK_RENDERER=gl"
          set "GDK_DISABLE=dcomp"
          start "" "%HERE%zrythm.exe"
          BATEOF
          sed -i 's/^          //' "$BINDIR/zrythm-launcher.bat"
          echo "--- launcher content ---"
          cat "$BINDIR/zrythm-launcher.bat"

      - name: Bundle runtime DLL dependencies (self-contained, no missing .dll)
        run: |
          BINDIR="/c/src/package/bin"
          if [ ! -d "$BINDIR" ]; then
            BINDIR=$(dirname "$(find /c/src/package -iname 'zrythm.exe' | head -1)")
          fi
          echo "Binary dir: $BINDIR"
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for bin in "$BINDIR"/*.exe "$BINDIR"/*.dll "$BINDIR"/../lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
              [ -f "$bin" ] || continue
              for dll in $(ldd "$bin" 2>/dev/null | grep -i '/ucrt64/bin/' | awk '{print $3}'); do
                name=$(basename "$dll")
                if [ ! -f "$BINDIR/$name" ]; then
                  cp "$dll" "$BINDIR/" && added=1
                  echo "Bundled: $name"
                fi
              done
            done
          done
          echo "--- final bin dir (pass 1) ---"
          ls "$BINDIR"

      - name: Bundle Carla plugin host (dlopen-loaded, not caught by ldd chain)
        run: |
          BINDIR="/c/src/package/bin"
          [ -d "$BINDIR" ] || BINDIR=$(dirname "$(find /c/src/package -iname 'zrythm.exe' | head -1)")

          # Carla installs its DLLs/plugin bridges under /ucrt64/lib/carla and /ucrt64/bin
          LIBDIR="$BINDIR/../lib"
          mkdir -p "$LIBDIR/carla"
          for src in /ucrt64/lib/carla /ucrt64/bin; do
            [ -d "$src" ] || continue
            find "$src" -maxdepth 2 -iname "libcarla_*.dll" -exec cp -v {} "$BINDIR/" \;
            find "$src" -maxdepth 2 -iname "carla*.exe" -exec cp -v {} "$LIBDIR/carla/" \;
          done
          # copy the carla plugin/resources tree it needs alongside the dll
          [ -d /ucrt64/lib/carla ] && cp -rv /ucrt64/lib/carla/* "$LIBDIR/carla/" 2>/dev/null || true

          # resolve dependencies of the Carla DLLs we just added (2nd pass, same expansion logic)
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for bin in "$BINDIR"/*.exe "$BINDIR"/*.dll "$BINDIR"/carla/*.dll; do
              [ -f "$bin" ] || continue
              for dll in $(ldd "$bin" 2>/dev/null | grep -i '/ucrt64/bin/' | awk '{print $3}'); do
                name=$(basename "$dll")
                if [ ! -f "$BINDIR/$name" ]; then
                  cp "$dll" "$BINDIR/" && added=1
                  echo "Bundled (carla dep): $name"
                fi
              done
            done
          done
          echo "--- final bin dir (pass 2, with carla) ---"
          ls "$BINDIR"

      - name: Zip clean package
        run: |
          cd /c/src/package
          zip -r -9 /c/src/zrythm-v1-windows-package.zip .
          du -sh /c/src/zrythm-v1-windows-package.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrythm-v1-windows-package
          path: C:/src/zrythm-v1-windows-package.zip
