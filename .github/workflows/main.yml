name: Build Zrythm v1 Windows Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zrythm
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout v1.0.0 tag (fork)
        shell: bash
        run: |
          cd zrythm
          git remote add upstream https://github.com/zrythm/zrythm.git
          git fetch upstream tag v1.0.0
          git checkout v1.0.0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            unzip
            base-devel
            tree
            guile
            libguile-devel
            mingw-w64-i686-toolchain
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-chromaprint
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-cantarell-fonts
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-python3
            mingw-w64-ucrt-x86_64-gtk-doc
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-xxhash
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-iconv
            mingw-w64-ucrt-x86_64-graphene
            mingw-w64-ucrt-x86_64-libsass
            mingw-w64-ucrt-x86_64-sassc
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-fluidsynth

      - name: Patch mingw-w64-headers stralign.h bug (ua_wcschr ambiguous declaration)
        run: |
          find /ucrt64 /mingw32 /mingw64 -name "stralign.h" 2>/dev/null | while read -r f; do
            echo "Patching: $f"
            sed -i -E 's/#if defined\(__cplusplus\) && defined\(_WConst_[Rr]eturn\)/#if 0/' "$f"
          done
          true

      - name: Move repo into MSYS2-native path
        run: |
          mkdir -p /c/src
          MSYS=winsymlinks:native mv /d/a/*/zrythm/zrythm /c/src/zrythm 2>/dev/null || \
          MSYS=winsymlinks:native mv "$GITHUB_WORKSPACE/zrythm" /c/src/zrythm

      - name: Install lilv/libpanel from prebuilt MSYS2 packages
        run: |
          for i in 1 2 3 4 5; do
            pacman -Sy --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-lilv mingw-w64-ucrt-x86_64-libpanel && break
            echo "pacman attempt $i failed, retrying in 15s..."
            sleep 15
          done
          pkg-config --modversion lilv-0
          pkg-config --modversion libpanel-1

      - name: Fetch Carla source
        run: |
          cd /c/src/zrythm
          if [ -d subprojects/carla ] && [ ! -f subprojects/carla/meson.build ]; then
            rm -rf subprojects/carla
          fi
          meson subprojects download carla
          test -d subprojects/carla
          test -f subprojects/carla/meson.build || {
            echo "FATAL: Carla subproject was not downloaded correctly"
            exit 1
          }

      - name: Build & install Carla natively (real UCRT64 DLLs, matching toolchain)
        run: |
          cd /c/src/zrythm/subprojects/carla

          pkg-config --exists fluidsynth && echo "fluidsynth found: $(pkg-config --modversion fluidsynth)" || (echo "FATAL: fluidsynth not found by pkg-config - SF2 support will be silently compiled out"; exit 1)

          FS_CFLAGS="$(pkg-config --cflags fluidsynth)"
          FS_LIBS="$(pkg-config --libs fluidsynth)"
          echo "FLUIDSYNTH_FLAGS=$FS_CFLAGS"
          echo "FLUIDSYNTH_LIBS=$FS_LIBS"

          if [ -z "$FS_LIBS" ]; then
            echo "FATAL: pkg-config --libs fluidsynth returned empty - cannot link"
            exit 1
          fi

          # Exported variables are required because Carla's recursive sub-makes
          # do not inherit command-line variables reliably.
          export FLUIDSYNTH_FLAGS="$FS_CFLAGS"
          export FLUIDSYNTH_LIBS="$FS_LIBS"

          make msys2fix
          make -e -j"$(nproc)" FLUIDSYNTH_FLAGS="$FS_CFLAGS" FLUIDSYNTH_LIBS="$FS_LIBS"
          make -e install PREFIX=/ucrt64 FLUIDSYNTH_FLAGS="$FS_CFLAGS" FLUIDSYNTH_LIBS="$FS_LIBS"

          echo "--- installed carla files ---"
          find /ucrt64 -iname "*carla*" 2>/dev/null
          echo "--- confirming SF2/fluidsynth support was actually compiled in ---"
          strings /ucrt64/lib/carla/*.dll /ucrt64/lib/carla/*.exe /ucrt64/bin/*carla* 2>/dev/null | grep -qi "fluidsynth support not available" && \
            (echo "FATAL: Carla was built WITHOUT fluidsynth support (HAVE_FLUIDSYNTH not defined) - SF2 plugins will never load"; exit 1) || \
            echo "OK: fluidsynth support appears compiled in"

      - name: Patch meson.build dbghelp linking bug (upstream oversight)
        run: |
          cd /c/src/zrythm
          sed -i "s/    cc.find_library ('dbghelp')/    dbg_help_lib = cc.find_library ('dbghelp')/" meson.build
          grep -n "dbg_help_lib = cc.find_library ('dbghelp')" meson.build

      - name: Fix hardcoded install prefix (portable build resolves paths from exe location)
        run: |
          cd /c/src/zrythm
          echo "" > /tmp/patch.py
          python3 /tmp/patch.py
          grep -n "g_win32_get_package_installation_directory_of_module" src/zrythm.c

      - name: Fix crash - NULL pointer dereference when a track icon fails to load
        run: |
          cd /c/src/zrythm
          echo "" > /tmp/patch_track.py
          python3 /tmp/patch_track.py

          echo "" > /tmp/patch_cb.py
          python3 /tmp/patch_cb.py

          echo "" > /tmp/patch_update_icons.py
          python3 /tmp/patch_update_icons.py

          echo "b2xkMSA9ICcncnAgc2VsZi0+aWNvbl90ZXh0dXJlID0gel9nZGtfdGV4dHVyZV9uZXdfZnJvbV9pY29uX25hbWUgKAogICAgc2VsZi0+aWNvbl9uYW1lLCB0ZXh0dXJlX3NpemUsIHRleHR1cmVfc2l6ZSwgMSk7CiAgaWYgKCFzZWxmLT5pY29uX3RleHR1cmUpCiAgICByZXR1cm47CiAgaWYgKCFzZWxmLT5pY29uX25hbWUpCiAgICByZXR1cm47" > /tmp/patch_cb_root.py
          python3 /tmp/patch_cb_root.py

          echo "b2xkID0gJycnICBHdGtJY29uVGhlbWUgKiAgICAgaWNvbl90aGVtZSA9IHpfZ3RrX2ljb25fdGhlbWVfZ2V0X2RlZmF1bHQgKCk7CiAgR3RrSWNvblBhaW50YWJsZSAqIHBhaW50YWJsZSA9IGd0a19pY29uX3RoZW1lX2xvb2t1cF9pY29uICgKICAgICAgICB0ZXh0dXJlX2JvbnNfZm9ybWF0LCB0ZXh0dXJlX3NpemUsIG1hdHJpeCwgbm8udWxscyk7" > /tmp/patch_gtk_c.py
          python3 /tmp/patch_gtk_c.py

          echo "b2xkID0gJycnR2RrVGV4dHVyZSAqCnpfZ2RrX3RleHR1cmVfbmV3X2Zyb21faWNvbl9uYW1lICgKICBjb25zdCBjaGFyICogaWNvbl9uYW1lLAogIGludCAgICAgICAgICB3aWR0aCwKICBpbnQgICAgICAgICAgaGVpZ2h0LAogIGludCAgICAgICAgICB0aW1lZ3Jlc3QpOwogIGlmICghdGV4dHVyZSB8fCAhR0RLX0lTX1RFWFRVUkUgKHRleHR1cmUpKQogICAgcmV0dXJuIE5VTEw7" > /tmp/patch_gtk_texture_fallback.py
          python3 /tmp/patch_gtk_texture_fallback.py

          echo "b2xkID0gJycnICBHZGtUZXh0dXJlICogdGV4dHVyZSA9IHpfZ2RrX3RleHR1cmVfbmV3X2Zyb21faWNvbl9uYW1lIChuYW1lLCAyNCwgMjQsIDEpOwogIGlmICghdGV4dHVyZSB8fCAhR0RLX0lTX1RFWFRVUkUgKHRleHR1cmUpKQogICAgewogICAgICByZXR1cm4gTlVMOwp0Ow==" > /tmp/patch_ui_cursor.py
          python3 /tmp/patch_ui_cursor.py

          echo "b2xkID0gJycnICAgIHsKICAgICAgYm9vbCBnZW5lcmljX3VpID0gc2V0dGluZy0+Zm9yY2VfZ2VuZXJpY191aTsKCiAgICAgIC8qIGhhbmRsZSBnZW5lcmljIFVJcywgdGhlbiBjYXJsYSBjdXN0b20sCiAgICAgICAqIHRoZW4gTFYyIGN1c3RvbSBVSS4gKQogICAgfQ==" > /tmp/patch_plugin_ui.py
          python3 /tmp/patch_plugin_ui.py

      - name: Route SF2/SFZ through Carla's real native UI
        run: |
          cd /c/src/zrythm
          echo "b2xkID0gJycnICAgICAgYm9vbCBnZW5lcmljX3VpID0KICAgICAgICBzZXR0aW5nLT5mb3JjZV9nZW5lcmljX3VpCiAgICAgICAgfHwgKHNldHRpbmctPmRlc2NyICYmICFzZXR0aW5nLT5kZXNjci0+aGFzX2N1c3RvbV91aSkKICAgICAgICB8IHNldHRpbmctPmRlc2NyICYmICFzZXR0aW5nLT5kZXNjci0+aGFzX2N1c3RvbV91aTs=" > /tmp/patch_sf2_ui_fix1.py
          python3 /tmp/patch_sf2_ui_fix1.py

          echo "b2xkID0gJycnICAgIGNhc2UgWl9QTFVHSU5fUFJPVE9DT0xfVlNUOgogICAgY2FzZSBaX1BMVUdJTl9QUk9UT0NPTF9WU1QzOgogICAgY2FzZSBaX1BMVUdJTl9QUk9UT0NPTF9EU1NJOgogICAgY2FzZSBaX1BMVUdJTl9QUk9UT0NPTF9MVjI6CiAgICAgIGNhc2UgWl9QTFVHSU5fUFJPVE9DT0xfU0YyOgogICAgICBjYXNlIFpfUExVSUdJTl9QUk9UT0NPTF9TRlo6" > /tmp/patch_sf2_ui_fix2.py
          python3 /tmp/patch_sf2_ui_fix2.py

          grep -n "protocol != Z_PLUGIN_PROTOCOL_SF2" src/plugins/plugin.c
          grep -n "case Z_PLUGIN_PROTOCOL_SF2:" src/plugins/carla_native_plugin.c

      - name: Skip 32-bit Carla VST bridge (reverted - caused a freeze on project creation)
        run: |
          cd /c/src/zrythm
          LINE=$(grep -n "carla_bins_dir_32bit = get_option" meson.build | cut -d: -f1)
          echo "Anchor line: $LINE"
          sed -i "$((LINE+1)),$((LINE+10))d" meson.build
          echo "--- result ---"
          sed -n "$((LINE-2)),$((LINE+3))p" meson.build

      - name: Replace non-ASCII chars in TRANSLATORS
        run: |
          cd /c/src/zrythm
          iconv -c -f utf-8 -t ascii//TRANSLIT TRANSLATORS > TRANSLATORS2 || true
          rm -f TRANSLATORS
          mv TRANSLATORS2 TRANSLATORS
          sed -i -e "s|\"|'|g" TRANSLATORS

      - name: Configure
        run: |
          cd /c/src/zrythm
          sed -i -e "s|'-lssp'|'-Wl,-allow-multiple-definition'|g" meson.build
          meson build --prefix=/ucrt64 -Db_lto=false -Dmanpage=false -Dtests=false -Dwrap_mode=default -Drtaudio=enabled -Drtmidi=enabled -Dsdl=enabled

      - name: Compile
        run: ninja -C /c/src/zrythm/build

      - name: Install into clean destdir (no build objects, real .exe)
        run: |
          cd /c/src/zrythm
          DESTDIR=/c/src/package ninja -C build install
          find /c/src/package -name "*.o" -o -name "*.a" | xargs -r rm -f

      - name: Flatten package structure (remove nested prefix folder, simple bin/lib/share layout)
        run: |
          cd /c/src/package
          find . -maxdepth 6
          EXE_PATH=$(find . -iname "zrythm.exe" | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "zrythm.exe not found anywhere in package!"
            exit 1
          fi
          PREFIX_DIR=$(dirname "$(dirname "$EXE_PATH")")
          echo "Found zrythm.exe at: $EXE_PATH"
          echo "Resolved prefix dir: $PREFIX_DIR"
          if [ "$PREFIX_DIR" != "." ]; then
            mv "$PREFIX_DIR"/* .
            rmdir -p "$PREFIX_DIR" 2>/dev/null || true
          fi
          echo "--- flattened top level ---"
          ls /c/src/package

      - name: Compile GSettings schema
        run: |
          SCHEMA_DIR=$(dirname "$(find /c/src/package -iname "org.zrythm.Zrythm.gschema.xml" | head -1)")
          if [ -z "$SCHEMA_DIR" ]; then
            echo "gschema.xml not found anywhere in package! searching wider:"
            find /c/src/package -iname "*.gschema.xml"
            exit 1
          fi
          echo "Found schema dir: $SCHEMA_DIR"
          cp -v /ucrt64/share/glib-2.0/schemas/*.gschema.xml "$SCHEMA_DIR/" 2>/dev/null || true
          ls "$SCHEMA_DIR"
          glib-compile-schemas "$SCHEMA_DIR"
          ls "$SCHEMA_DIR"

      - name: Bundle gdk-pixbuf SVG loader
        run: |
          BINDIR="/c/src/package/bin"
          LOADER_SRC_DIR="/ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          LOADER_DST_DIR="$BINDIR/../lib/gdk-pixbuf-2.0/2.10.0/loaders"
          mkdir -p "$LOADER_DST_DIR"
          cp -v "$LOADER_SRC_DIR"/*.dll "$LOADER_DST_DIR/"
          ls "$LOADER_DST_DIR"
          GDK_PIXBUF_MODULEDIR="$LOADER_DST_DIR" gdk-pixbuf-query-loaders > "$LOADER_DST_DIR/loaders.cache"
          sed -i -E 's|^"[^"]*[\\/]([^\\/"]+\.dll)"|"\1"|' "$LOADER_DST_DIR/loaders.cache"
          echo "--- final loaders.cache ---"
          cat "$LOADER_DST_DIR/loaders.cache"

      - name: Bundle GLib/GIO helper executables
        run: |
          BINDIR="/c/src/package/bin"
          for exe in gdbus.exe gio.exe gio-launch-desktop.exe gsettings.exe gspawn-win64-helper.exe gspawn-win64-helper-console.exe; do
            [ -f "/ucrt64/bin/$exe" ] && cp -v "/ucrt64/bin/$exe" "$BINDIR/"
          done

      - name: Bundle Adwaita/hicolor icon themes
        run: |
          ICONS_DST="/c/src/package/share/icons"
          mkdir -p "$ICONS_DST"
          for theme in Adwaita hicolor; do
            if [ -d "/ucrt64/share/icons/$theme" ]; then
              cp -r "/ucrt64/share/icons/$theme" "$ICONS_DST/"
              echo "Bundled icon theme: $theme"
            fi
          done
          mkdir -p "$ICONS_DST/default"
          cat > "$ICONS_DST/default/index.theme" << 'THEMEEOF'
          [Icon Theme]
          Name=Default
          Comment=Fallback pointing to Adwaita (no desktop "default" theme on Windows)
          Inherits=Adwaita,hicolor
          Directories=
          THEMEEOF
          sed -i 's/^          //' "$ICONS_DST/default/index.theme"
          cat "$ICONS_DST/default/index.theme"
          for theme in Adwaita hicolor; do
            [ -d "$ICONS_DST/$theme" ] && gtk4-update-icon-cache -f "$ICONS_DST/$theme" 2>&1 || true
          done
          ls "$ICONS_DST"

      - name: Create portable launcher
        run: |
          BINDIR="/c/src/package/bin"
          SCHEMA_DIR=$(dirname "$(find /c/src/package -iname "org.zrythm.Zrythm.gschema.xml" | head -1)")
          SHARE_DIR=$(dirname "$(dirname "$SCHEMA_DIR")")
          REL_SHARE=$(python3 -c "import os; print(os.path.relpath('$SHARE_DIR','$BINDIR').replace('/', '\\\\'))")
          echo "Relative share dir from bin: $REL_SHARE"
          cat << BATEOF > "$BINDIR/zrythm-launcher.bat"
          @echo off
          set "HERE=%~dp0"
          set "GSETTINGS_SCHEMA_DIR=%HERE%${REL_SHARE}\glib-2.0\schemas"
          set "XDG_DATA_DIRS=%HERE%${REL_SHARE}"
          set "GDK_PIXBUF_MODULE_FILE=%HERE%..\lib\gdk-pixbuf-2.0\2.10.0\loaders\loaders.cache"
          if not exist "%~d0\ucrt64\share\icons\hicolor" (
            mkdir "%~d0\ucrt64\share\icons" >nul 2>&1
            xcopy /E /I /Y /Q "%HERE%${REL_SHARE}\icons\hicolor" "%~d0\ucrt64\share\icons\hicolor" >nul 2>&1
          )
          start "" "%HERE%zrythm.exe" --audio-backend=SDL --midi-backend="Windows MME"
          BATEOF
          sed -i 's/^          //' "$BINDIR/zrythm-launcher.bat"
          echo "--- launcher content ---"
          cat "$BINDIR/zrythm-launcher.bat"

      - name: Bundle runtime DLL dependencies
        run: |
          BINDIR="/c/src/package/bin"
          if [ ! -d "$BINDIR" ]; then
            BINDIR=$(dirname "$(find /c/src/package -iname 'zrythm.exe' | head -1)")
          fi
          echo "Binary dir: $BINDIR"
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for bin in "$BINDIR"/*.exe "$BINDIR"/*.dll "$BINDIR"/../lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
              [ -f "$bin" ] || continue
              for dll in $(ldd "$bin" 2>/dev/null | grep -i '/ucrt64/bin/' | awk '{print $3}'); do
                name=$(basename "$dll")
                if [ ! -f "$BINDIR/$name" ]; then
                  cp "$dll" "$BINDIR/" && added=1
                  echo "Bundled: $name"
                fi
              done
            done
          done
          echo "--- final bin dir (pass 1) ---"
          ls "$BINDIR"

      - name: Bundle Carla plugin host
        run: |
          BINDIR="/c/src/package/bin"
          [ -d "$BINDIR" ] || BINDIR=$(dirname "$(find /c/src/package -iname 'zrythm.exe' | head -1)")

          LIBDIR="$BINDIR/../lib/zrythm"
          mkdir -p "$LIBDIR/carla"
          for src in /ucrt64/lib/carla /ucrt64/bin; do
            [ -d "$src" ] || continue
            find "$src" -maxdepth 2 -iname "libcarla_*.dll" -exec cp -v {} "$BINDIR/" \;
            find "$src" -maxdepth 2 -iname "carla*.exe" -exec cp -v {} "$LIBDIR/carla/" \;
          done
          [ -d /ucrt64/lib/carla ] && cp -rv /ucrt64/lib/carla/* "$LIBDIR/carla/" 2>/dev/null || true

          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for bin in "$BINDIR"/*.exe "$BINDIR"/*.dll "$LIBDIR"/carla/*.dll "$LIBDIR"/carla/*.exe; do
              [ -f "$bin" ] || continue
              bindir_of="$(dirname "$bin")"
              for dll in $(ldd "$bin" 2>/dev/null | grep -i '/ucrt64/bin/' | awk '{print $3}'); do
                name=$(basename "$dll")
                if [ ! -f "$bindir_of/$name" ] && [ ! -f "$BINDIR/$name" ]; then
                  cp "$dll" "$bindir_of/" && added=1
                  echo "Bundled (carla dep): $name -> $bindir_of"
                fi
              done
            done
          done
          echo "--- final bin dir (pass 2, with carla) ---"
          ls "$BINDIR"

      - name: Guarantee carla-discovery-native.exe is present
        run: |
          LIBDIR="/c/src/package/bin/../lib/zrythm/carla"
          mkdir -p "$LIBDIR"
          NEEDED="$LIBDIR/carla-discovery-native.exe"
          if [ ! -f "$NEEDED" ]; then
            echo "carla-discovery-native.exe missing after normal bundling, searching fallback locations..."
            FOUND=$(find /c/src/zrythm/subprojects/carla/bin /ucrt64/lib/carla /ucrt64/bin -iname "carla-discovery-native.exe" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp -v "$FOUND" "$NEEDED"
            fi
          fi
          if [ ! -f "$NEEDED" ]; then
            echo "FATAL: carla-discovery-native.exe was never built/installed by Carla."
            echo "-- searching whole tree for any carla-discovery* to help diagnose --"
            find /c/src/zrythm/subprojects/carla -iname "carla-discovery*" 2>/dev/null
            find /ucrt64 -iname "carla-discovery*" 2>/dev/null
            exit 1
          fi
          echo "OK: $NEEDED present"
          ls -la "$LIBDIR"

      - name: Bundle Adwaita cursor theme
        run: |
          pacman -S --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-adwaita-icon-theme || true
          CURSORS_SRC="/ucrt64/share/icons/Adwaita/cursors"
          CURSORS_DST="/c/src/package/share/icons/Adwaita/cursors"
          if [ -d "$CURSORS_SRC" ]; then
            mkdir -p "$CURSORS_DST"
            cp -r "$CURSORS_SRC/." "$CURSORS_DST/"
          else
            echo "WARNING: no Adwaita cursor set found in UCRT64 - cursor bug will persist"
          fi

      - name: Zip clean package
        run: |
          cd /c/src/package
          zip -r -9 /c/src/zrythm-v1-windows-package.zip .
          du -sh /c/src/zrythm-v1-windows-package.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrythm-v1-windows-package
          path: C:/src/zrythm-v1-windows-package.zip
